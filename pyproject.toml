[project]
name = "ai-media-workflow"
version = "0.1.0"
description = "Modular workflow engine for AI-driven media processing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",         # async SQLite driver
    "greenlet>=3.0",           # required by SQLAlchemy async
    "httpx>=0.27",             # async HTTP client (for block I/O)
    "openai>=1.40",            # OpenAI API client for LLM blocks
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "pre-commit>=3.8",
    "Pillow>=10.0",  # placeholder image generation in tests
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
