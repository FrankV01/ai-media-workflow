<p class="text-sm text-gray-500 mb-6">
    Paste Markdown to get the raw HTML, or paste HTML to get Markdown back.
    Conversion runs on the server (mistune / markdownify); nothing is stored.
    Up to 1,000,000 characters.
</p>

<section class="bg-gray-900 rounded-lg p-5 border border-gray-800">

    <div class="flex items-center gap-1 mb-5" role="radiogroup" aria-label="Conversion direction">
        <label class="cursor-pointer">
            <input type="radio" name="mk-direction" value="markdown-to-html" class="peer sr-only" checked>
            <span class="inline-block px-4 py-1.5 text-sm rounded-l-md border border-gray-700
                         text-gray-400 peer-checked:bg-indigo-600 peer-checked:text-white
                         peer-checked:border-indigo-600 transition-colors duration-150">
                Markdown → HTML
            </span>
        </label>
        <label class="cursor-pointer -ml-px">
            <input type="radio" name="mk-direction" value="html-to-markdown" class="peer sr-only">
            <span class="inline-block px-4 py-1.5 text-sm rounded-r-md border border-gray-700
                         text-gray-400 peer-checked:bg-indigo-600 peer-checked:text-white
                         peer-checked:border-indigo-600 transition-colors duration-150">
                HTML → Markdown
            </span>
        </label>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label for="mk-input" class="block text-sm font-medium text-gray-300 mb-1">
                Input (<span id="mk-input-label">Markdown</span>)
            </label>
            <textarea id="mk-input" spellcheck="false"
                      class="font-mono text-sm bg-gray-800 border border-gray-700 rounded p-3
                             w-full h-80 resize-y"
                      placeholder="Paste your text here…"></textarea>
            <p id="mk-input-count" class="mt-1 text-xs text-gray-500">0 chars</p>
        </div>
        <div>
            <label for="mk-output" class="block text-sm font-medium text-gray-300 mb-1">
                Output (<span id="mk-output-label">HTML</span>)
            </label>
            <textarea id="mk-output" readonly spellcheck="false"
                      class="font-mono text-sm bg-gray-800 border border-gray-700 rounded p-3
                             w-full h-80 resize-y"></textarea>
            <p id="mk-output-count" class="mt-1 text-xs text-gray-500">0 chars</p>
        </div>
    </div>

    <div class="mt-4 flex flex-wrap items-center gap-3">
        <button id="mk-convert" type="button"
                class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700
                       text-white text-sm px-5 py-2 rounded font-medium transition-colors duration-150">
            Convert
        </button>
        <button id="mk-copy" type="button" disabled
                class="border border-gray-600 hover:border-gray-400 text-gray-300
                       disabled:opacity-40 disabled:cursor-not-allowed
                       text-sm px-4 py-2 rounded transition-colors duration-150">
            Copy output
        </button>
        <button id="mk-swap" type="button"
                class="border border-gray-600 hover:border-gray-400 text-gray-300
                       text-sm px-4 py-2 rounded transition-colors duration-150">
            Use output as input ⇄
        </button>
        <button id="mk-clear" type="button"
                class="text-xs text-indigo-400 hover:text-indigo-300 uppercase tracking-wide">
            Clear
        </button>
        <p id="mk-status" class="text-xs text-gray-500"></p>
    </div>

    <p id="mk-error" class="hidden text-sm text-red-400 mt-3" role="alert"></p>

    <noscript>
        <p class="mt-4 text-sm text-gray-500">This tool requires JavaScript.</p>
    </noscript>
</section>
