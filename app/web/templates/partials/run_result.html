{% if error %}
<div class="flex items-start gap-2 p-3 rounded bg-red-900/30 border border-red-800/50">
    <span class="text-red-400 shrink-0">✗</span>
    <div>
        <p class="text-sm text-red-300 font-medium">Job #{{ job_id }} — Failed</p>
        <p class="text-xs text-red-400/80 mt-1">{{ error }}</p>
    </div>
</div>
{% else %}
<div class="flex items-start gap-2 p-3 rounded bg-emerald-900/30 border border-emerald-800/50">
    <span class="text-emerald-400 shrink-0">✓</span>
    <div>
        <p class="text-sm text-emerald-300 font-medium">Job #{{ job_id }} — Completed</p>
        {% if steps %}
        <div class="mt-2 space-y-1">
            {% for step in steps %}
            <div class="text-xs text-gray-400">
                <span class="text-gray-500">{{ step.order + 1 }}.</span>
                <span class="font-mono text-gray-300">{{ step.block_name }}</span>
                {% if step.output %}
                <span class="text-emerald-400/70 ml-1">→ {{ step.output }}</span>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</div>
{% endif %}

<!-- Trigger job list refresh after run -->
<script>htmx.trigger("#job-list", "load");</script>
