<div id="job-images"
     {% if job_status in ["pending", "running"] %}
     hx-get="/partials/jobs/{{ job_id }}/images"
     hx-trigger="every 3s"
     hx-swap="outerHTML"
     {% endif %}>
    {% if images %}
    <div class="mt-4 p-3 rounded bg-gray-800/60 border border-gray-700/50">
        <p class="text-sm text-gray-300 font-medium">Generated images</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-3">
            {% for image in images %}
            <a href="/jobs/{{ job_id }}/images/{{ image.index }}"
               target="_blank"
               rel="noopener"
               class="group block overflow-hidden rounded bg-gray-900 border border-gray-700 hover:border-indigo-500 transition-colors">
                <img src="/jobs/{{ job_id }}/images/{{ image.index }}"
                     alt="{{ image.label }}"
                     loading="lazy"
                     class="w-full h-48 object-cover group-hover:opacity-90 transition-opacity">
                <div class="p-2">
                    <p class="text-xs text-gray-300">{{ image.label }}</p>
                    <p class="text-[10px] text-gray-500 truncate">{{ image.name }}</p>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
