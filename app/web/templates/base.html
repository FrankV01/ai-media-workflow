<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Media Workflow{% endblock %}</title>

    <!-- Tailwind CSS via CDN (swap for local build in production) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX for dynamic partial updates -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>

    {% block head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

    <!-- Top navigation bar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center justify-between">
        <a href="/" class="text-lg font-semibold text-white">⚡ AI Media Workflow</a>
        <div class="flex gap-4 text-sm text-gray-400">
            <a href="/" class="hover:text-white">Dashboard</a>
            <a href="/settings/ai" class="hover:text-white">AI Settings</a>
            <a href="/docs" class="hover:text-white">API Docs</a>
        </div>
        <style>
            .job-preview { pointer-events: auto; }
        </style>
    </nav>

    <!-- Main content -->
    <main class="max-w-6xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
