<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Media Workflow{% endblock %}</title>

    <!-- Tailwind CSS via CDN (swap for local build in production) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX for dynamic partial updates -->
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>

    {% block head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

    <!-- Top navigation bar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex items-center justify-between">
        <a href="/" class="text-lg font-semibold text-white">⚡ {{ app_name }}</a>
        <div class="flex gap-4 text-sm text-gray-400">
            <a href="/" class="hover:text-white">Dashboard</a>
            <a href="/workflows" class="hover:text-white">Workflows</a>
            <a href="/convert" class="hover:text-white">Convert</a>
            <a href="/remove-background" class="hover:text-white">Remove BG</a>
            <a href="/settings/ai" class="hover:text-white">AI Settings</a>
            <a href="/settings/general" class="hover:text-white">General Settings</a>
            <a href="/docs" class="hover:text-white">API Docs</a>
        </div>
        <style>
            .job-preview { pointer-events: auto; }
            .markdown-preview > :first-child { margin-top: 0; }
            .markdown-preview > :last-child { margin-bottom: 0; }
            .markdown-preview h1, .markdown-preview h2, .markdown-preview h3 { color: #f3f4f6; font-weight: 600; margin: 0.8rem 0 0.35rem; }
            .markdown-preview h1 { font-size: 1.25rem; }
            .markdown-preview h2 { font-size: 1.125rem; }
            .markdown-preview h3 { font-size: 1rem; }
            .markdown-preview p, .markdown-preview ul, .markdown-preview ol, .markdown-preview blockquote, .markdown-preview pre { margin: 0.5rem 0; }
            .markdown-preview ul { list-style: disc; padding-left: 1.25rem; }
            .markdown-preview ol { list-style: decimal; padding-left: 1.25rem; }
            .markdown-preview a { color: #818cf8; text-decoration: underline; }
            .markdown-preview blockquote { border-left: 3px solid #4b5563; color: #9ca3af; padding-left: 0.75rem; }
            .markdown-preview code { background: #111827; border-radius: 0.25rem; font-family: ui-monospace, monospace; padding: 0.1rem 0.25rem; }
            .markdown-preview pre { background: #111827; border-radius: 0.375rem; overflow-x: auto; padding: 0.75rem; }
            .markdown-preview pre code { padding: 0; }
        </style>
    </nav>

    <!-- Main content -->
    <main class="max-w-6xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="px-6 pb-6 text-center text-xs text-gray-600">
        AI Media Workflow v{{ app_version }} · build {{ build_number }}
    </footer>

</body>
</html>
